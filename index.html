<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiPER Calculator Pro</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        .header .menu-btn {
            font-size: 22px;
            cursor: pointer;
            background: none;
            border: none;
            color: #fff;
        }

        .header .title {
            font-size: 18px;
            font-weight: 600;
        }

        /* Side Navigation Drawer */
        .sidebar {
            position: fixed;
            top: 0;
            left: -260px;
            width: 250px;
            height: 100%;
            background: #1e1e1e;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar h3 {
            padding: 10px 20px;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
        }

        .sidebar-item {
            padding: 14px 20px;
            color: #ddd;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: #2c2c2c;
            color: #4d90fe;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Views Container */
        .content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .view-panel {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .view-panel.active {
            display: flex;
        }

        /* Main Display Screen */
        .display {
            background: #000;
            border-radius: 12px;
            padding: 16px;
            text-align: right;
            margin-bottom: 12px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .display .expression {
            color: #888;
            font-size: 16px;
            word-wrap: break-word;
        }

        .display .result {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
        }

        /* Button Keypad Layout */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            flex: 1;
        }

        button.btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        button.btn:active {
            background: #3a3a3a;
        }

        button.btn-op {
            background: #f39c12;
            color: #fff;
        }

        button.btn-action {
            background: #e74c3c;
        }

        button.btn-equal {
            background: #2980b9;
            grid-column: span 2;
        }

        /* Feature Input Forms */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
        }

        /* History List */
        .history-list {
            list-style: none;
            overflow-y: auto;
            max-height: 80vh;
        }

        .history-item {
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        .history-item .hist-expr { color: #aaa; font-size: 14px; }
        .history-item .hist-res { color: #2ecc71; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="title" id="header-title">General Calculator</div>
        <button class="menu-btn" onclick="switchView('history')">📜</button>
    </div>

    <!-- Side Drawer Overlay -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Side Navigation Menu -->
    <div class="sidebar" id="sidebar">
        <h3>Calculators</h3>
        <div class="sidebar-item active" onclick="selectMenu('calc', 'General Calculator')">Calculator</div>
        <div class="sidebar-item" onclick="selectMenu('currency', 'Currency Converter')">Currencies</div>
        <div class="sidebar-item" onclick="selectMenu('unit', 'Unit Converter')">Units</div>
        <div class="sidebar-item" onclick="selectMenu('discount', 'Discount Calculator')">Discount</div>
        <div class="sidebar-item" onclick="selectMenu('loan', 'Loan Calculator')">Loan</div>
        <h3>More</h3>
        <div class="sidebar-item" onclick="selectMenu('history', 'Calculation History')">History</div>
    </div>

    <!-- Main Content Area -->
    <div class="content">

        <!-- 1. General Scientific Calculator View -->
        <div id="view-calc" class="view-panel active">
            <div class="display">
                <div class="expression" id="expr-display"></div>
                <div class="result" id="res-display">0</div>
            </div>
            <div class="keypad">
                <button class="btn btn-action" onclick="clearCalc()">C</button>
                <button class="btn" onclick="appendInput('(')">(</button>
                <button class="btn" onclick="appendInput(')')">)</button>
                <button class="btn btn-op" onclick="appendInput('/')">÷</button>

                <button class="btn" onclick="appendInput('7')">7</button>
                <button class="btn" onclick="appendInput('8')">8</button>
                <button class="btn" onclick="appendInput('9')">9</button>
                <button class="btn btn-op" onclick="appendInput('*')">×</button>

                <button class="btn" onclick="appendInput('4')">4</button>
                <button class="btn" onclick="appendInput('5')">5</button>
                <button class="btn" onclick="appendInput('6')">6</button>
                <button class="btn btn-op" onclick="appendInput('-')">-</button>

                <button class="btn" onclick="appendInput('1')">1</button>
                <button class="btn" onclick="appendInput('2')">2</button>
                <button class="btn" onclick="appendInput('3')">3</button>
                <button class="btn btn-op" onclick="appendInput('+')">+</button>

                <button class="btn" onclick="appendInput('0')">0</button>
                <button class="btn" onclick="appendInput('.')">.</button>
                <button class="btn btn-equal" onclick="calculateResult()">=</button>
            </div>
        </div>

        <!-- 2. Unit Converter View -->
        <div id="view-unit" class="view-panel">
            <div class="form-group">
                <label>From Unit (Kilometers)</label>
                <input type="number" id="unit-input" placeholder="Enter value" oninput="convertUnit()">
            </div>
            <div class="form-group">
                <label>Result (Miles)</label>
                <input type="text" id="unit-output" readonly>
            </div>
        </div>

        <!-- 3. Discount Calculator View -->
        <div id="view-discount" class="view-panel">
            <div class="form-group">
                <label>Original Price</label>
                <input type="number" id="disc-price" placeholder="1000">
            </div>
            <div class="form-group">
                <label>Discount (%)</label>
                <input type="number" id="disc-percent" placeholder="10">
            </div>
            <button class="btn btn-op" style="width: 100%; padding: 12px; margin-bottom: 15px;" onclick="calcDiscount()">Calculate</button>
            <div class="display">
                <div class="expression">Final Price</div>
                <div class="result" id="disc-result">0</div>
            </div>
        </div>

        <!-- 4. Loan EMI View -->
        <div id="view-loan" class="view-panel">
            <div class="form-group">
                <label>Loan Amount</label>
                <input type="number" id="loan-amount" placeholder="100000">
            </div>
            <div class="form-group">
                <label>Interest Rate (% per year)</label>
                <input type="number" id="loan-rate" placeholder="8.5">
            </div>
            <div class="form-group">
                <label>Tenure (Months)</label>
                <input type="number" id="loan-months" placeholder="12">
            </div>
            <button class="btn btn-op" style="width: 100%; padding: 12px; margin-bottom: 15px;" onclick="calcEMI()">Calculate EMI</button>
            <div class="display">
                <div class="expression">Monthly EMI</div>
                <div class="result" id="loan-result">0</div>
            </div>
        </div>

        <!-- 5. History View -->
        <div id="view-history" class="view-panel">
            <ul class="history-list" id="history-container">
                <li class="history-item"><div class="hist-expr">No history yet</div></li>
            </ul>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        let currInput = "";

        // Haptic Vibration & Sound
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (navigator.vibrate) navigator.vibrate(15);
            });
        });

        // Drawer Navigation Functions
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function selectMenu(viewId, title) {
            document.getElementById('header-title').innerText = title;
            switchView(viewId);
            toggleSidebar();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            if(viewId === 'history') renderHistory();
        }

        // Calculator Logic
        function appendInput(val) {
            currInput += val;
            document.getElementById('expr-display').innerText = currInput;
        }

        function clearCalc() {
            currInput = "";
            document.getElementById('expr-display').innerText = "";
            document.getElementById('res-display').innerText = "0";
        }

        function calculateResult() {
            try {
                let res = eval(currInput);
                document.getElementById('res-display').innerText = res;
                saveToHistory(currInput, res);
            } catch (e) {
                document.getElementById('res-display').innerText = "Error";
            }
        }

        // Save & Load History
        function saveToHistory(expr, res) {
            let history = JSON.parse(localStorage.getItem('calc_hist')) || [];
            history.unshift({ expr: expr, res: res });
            localStorage.setItem('calc_hist', JSON.stringify(history));
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('calc_hist')) || [];
            let container = document.getElementById('history-container');
            if (history.length === 0) {
                container.innerHTML = '<li class="history-item"><div class="hist-expr">No history available</div></li>';
                return;
            }
            container.innerHTML = history.map(item => `
                <li class="history-item">
                    <div class="hist-expr">${item.expr}</div>
                    <div class="hist-res">= ${item.res}</div>
                </li>
            `).join('');
        }

        // Unit Converter Logic
        function convertUnit() {
            let val = parseFloat(document.getElementById('unit-input').value) || 0;
            document.getElementById('unit-output').value = (val * 0.621371).toFixed(2) + " Miles";
        }

        // Discount Logic
        function calcDiscount() {
            let price = parseFloat(document.getElementById('disc-price').value) || 0;
            let percent = parseFloat(document.getElementById('disc-percent').value) || 0;
            let finalPrice = price - (price * (percent / 100));
            document.getElementById('disc-result').innerText = "₹" + finalPrice.toFixed(2);
        }

        // EMI Logic
        function calcEMI() {
            let p = parseFloat(document.getElementById('loan-amount').value) || 0;
            let r = (parseFloat(document.getElementById('loan-rate').value) || 0) / 12 / 100;
            let n = parseFloat(document.getElementById('loan-months').value) || 0;
            if (p && r && n) {
                let emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                document.getElementById('loan-result').innerText = "₹" + emi.toFixed(2);
            }
        }
    </script>

    <!-- Adsterra Social Bar Ads -->
    <script src="https://pl30790893.effectivecpmnetwork.com/e0/d9/e1/e0d9e140d2a95360f9f664cd9cdfcc54.js"></script>
</body>
</html>
