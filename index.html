<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #121318; color: #ffffff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; overflow: hidden; }
    
    /* Calculator Container */
    .calculator { display: flex; flex-direction: column; height: calc(100vh - 50px); padding: 20px; justify-content: flex-end; }
    
    /* Display Area */
    .display-screen { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 10px 10px 20px 10px; text-align: right; word-break: break-all; min-height: 140px; }
    .history { font-size: 1.3rem; color: #8a8d9b; min-height: 30px; font-weight: 400; }
    .input-val { font-size: 3.2rem; font-weight: 700; color: #ffffff; line-height: 1.2; margin-top: 5px; }

    /* Keypad Grid */
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    button { background: #23272f; border: none; outline: none; border-radius: 20px; font-size: 1.6rem; color: #ffffff; height: 68px; font-weight: 500; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; display: flex; align-items: center; justify-content: center; }
    button:active { background: #323846; transform: scale(0.95); }
    
    /* Button Colors */
    .btn-clear { color: #ff6b4a; background: #1c222d; font-weight: 600; }
    .btn-op { color: #00b4d8; background: #1c222d; font-size: 1.8rem; }
    .btn-back { color: #ff6b4a; background: #1c222d; }
    .btn-equal { background: #00b4d8; color: #ffffff; font-size: 2rem; font-weight: 600; }

    /* Bottom Fixed Banner Ad Container */
    #ad-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; text-align: center; background: #000000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Display -->
    <div class="display-screen">
      <div class="history" id="history"></div>
      <div class="input-val" id="display">0</div>
    </div>

    <!-- Buttons Grid -->
    <div class="buttons">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn-op" onclick="appendOp('/')">÷</button>
      <button class="btn-op" onclick="appendOp('*')">×</button>
      <button class="btn-back" onclick="deleteLast()">⌫</button>

      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="btn-op" onclick="appendOp('-')">-</button>

      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="btn-op" onclick="appendOp('+')">+</button>

      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="btn-op" onclick="appendOp('%')">%</button>

      <button onclick="appendNum('0')">0</button>
      <button onclick="appendNum('00')">00</button>
      <button onclick="appendNum('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- Adsterra 320x50 Banner Code Included -->
  <div id="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : 'bd2b6f488661ebbe01d2c94d03df6b31',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/bd2b6f488661ebbe01d2c94d03df6b31/invoke.js"></script>
  </div>

  <script>
    let display = document.getElementById('display');
    let history = document.getElementById('history');

    function appendNum(num) {
      if (display.innerText === '0' || display.innerText === 'Error') {
        display.innerText = num;
      } else {
        display.innerText += num;
      }
    }

    function appendOp(op) {
      if (display.innerText === 'Error') return;
      let lastChar = display.innerText.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        display.innerText = display.innerText.slice(0, -1) + op;
      } else {
        display.innerText += op;
      }
    }

    function clearDisplay() {
      display.innerText = '0';
      history.innerText = '';
    }

    function deleteLast() {
      if (display.innerText.length === 1 || display.innerText === 'Error') {
        display.innerText = '0';
      } else {
        display.innerText = display.innerText.slice(0, -1);
      }
    }

    function calculate() {
      try {
        history.innerText = display.innerText;
        let expr = display.innerText.replace(/×/g, '*').replace(/÷/g, '/');
        
        // Handle percentage calculation correctly
        expr = expr.replace(/(\d+)%/g, '($1/100)');

        let result = eval(expr);
        display.innerText = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
      } catch (e) {
        display.innerText = 'Error';
      }
    }
  </script>
</body>
</html>
