<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; overflow: hidden; }
    
    /* Calculator Container */
    .calculator { display: flex; flex-direction: column; height: calc(100vh - 60px); padding: 15px; }
    
    /* Display Screen */
    .display-screen { background: #1e1e1e; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; flex: 1; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    .history { font-size: 1.1rem; color: #a5a5a5; min-height: 24px; word-break: break-all; }
    .input-val { font-size: 2.5rem; font-weight: bold; margin-top: 5px; word-break: break-all; }
    .word-val { font-size: 0.9rem; color: #00adb5; margin-top: 5px; font-weight: 500; text-align: right; }

    /* Keypad Grid */
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button { background: #2d2d2d; border: none; outline: none; border-radius: 16px; font-size: 1.5rem; color: #fff; padding: 18px 0; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    button:active { background: #3d3d3d; transform: scale(0.95); }
    
    /* Special Button Colors */
    .btn-operator { color: #00adb5; background: #222831; }
    .btn-action { color: #ff5722; background: #222831; }
    .btn-equal { background: #00adb5; color: #fff; grid-column: span 2; border-radius: 16px; }

    /* Bottom Fixed Banner Ad Container */
    #ad-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; text-align: center; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Screen -->
    <div class="display-screen">
      <div class="history" id="history"></div>
      <div class="input-val" id="display">0</div>
      <div class="word-val" id="words">Zero</div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="btn-action" onclick="clearDisplay()">C</button>
      <button class="btn-operator" onclick="appendOp('/')">÷</button>
      <button class="btn-operator" onclick="appendOp('*')">×</button>
      <button class="btn-action" onclick="deleteLast()">⌫</button>

      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="btn-operator" onclick="appendOp('-')">-</button>

      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="btn-operator" onclick="appendOp('+')">+</button>

      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="btn-operator" onclick="appendOp('%')">%</button>

      <button onclick="appendNum('0')">0</button>
      <button onclick="appendNum('00')">00</button>
      <button onclick="appendNum('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- Adsterra 320x50 Banner Code Included -->
  <div id="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : 'bd2b6f488661ebbe01d2c94d03df6b31',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/bd2b6f488661ebbe01d2c94d03df6b31/invoke.js"></script>
  </div>

  <script>
    let display = document.getElementById('display');
    let history = document.getElementById('history');
    let words = document.getElementById('words');

    function appendNum(num) {
      if (display.innerText === '0') {
        display.innerText = num;
      } else {
        display.innerText += num;
      }
      updateWords();
    }

    function appendOp(op) {
      let lastChar = display.innerText.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        display.innerText = display.innerText.slice(0, -1) + op;
      } else {
        display.innerText += op;
      }
    }

    function clearDisplay() {
      display.innerText = '0';
      history.innerText = '';
      words.innerText = 'Zero';
    }

    function deleteLast() {
      if (display.innerText.length === 1 || display.innerText === 'Error') {
        display.innerText = '0';
      } else {
        display.innerText = display.innerText.slice(0, -1);
      }
      updateWords();
    }

    function calculate() {
      try {
        history.innerText = display.innerText;
        let result = eval(display.innerText.replace(/×/g, '*').replace(/÷/g, '/'));
        display.innerText = result;
        updateWords();
      } catch (e) {
        display.innerText = 'Error';
        words.innerText = '';
      }
    }

    function updateWords() {
      let val = parseFloat(display.innerText);
      if (!isNaN(val) && isFinite(val) && val < 1000000000) {
        words.innerText = numberToWords(val);
      } else {
        words.innerText = '';
      }
    }

    function numberToWords(num) {
      if (num === 0) return 'Zero';
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
      
      function inWords(n) {
        if (n < 20) return a[n];
        let digit = n % 10;
        if (n < 100) return b[Math.floor(n / 10)] + (digit ? ' ' + a[digit] : '');
        if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + inWords(n % 100) : '');
        if (n < 100000) return inWords(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 ? ' ' + inWords(n % 1000) : '');
        if (n < 10000000) return inWords(Math.floor(n / 100000)) + ' Lakh' + (n % 100000 ? ' ' + inWords(n % 100000) : '');
        return inWords(Math.floor(n / 10000000)) + ' Crore' + (n % 10000000 ? ' ' + inWords(n % 10000000) : '');
      }
      return inWords(num);
    }
  </script>
</body>
</html>
